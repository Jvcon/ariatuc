[project]
name = "ariatuc"
version = "0.1.0"
description = "Aria2c TUI - Terminal User Interface for aria2c download manager"
authors = [{ name = "Jacques Ye", email = "jayto118@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
keywords = ["aria2", "tui", "terminal", "download-manager", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=6.10.0,<7.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ariatuc = "ariatuc.main:main"

# [project.urls]
# Homepage = "https://github.com/jayto118/ariatuc"
# Repository = "https://github.com/jayto118/ariatuc"
# Issues = "https://github.com/jayto118/ariatuc/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.11,<0.15.0",
    "mypy>=1.19.1,<2.0.0",
]

[tool.poetry]
packages = [{ include = "ariatuc", from = "src" }]

# ==============================================================================
# Pytest Configuration
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (require running aria2c)",
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "asyncio: marks tests as async tests",
]
# Asyncio mode for pytest-asyncio
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ==============================================================================
# Ruff Configuration - Modern Python Linter & Formatter
# ==============================================================================
[tool.ruff]
# Target Python 3.11+
target-version = "py311"

# Source code locations
src = ["src", "tests"]

# Line length to match Black's default
line-length = 100

# Exclude common directories
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
# Enable recommended rules + additional useful rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ASYNC", # flake8-async
]

# Ignore specific rules that are too strict or inappropriate
ignore = [
    "E501",     # Line too long (handled by formatter)
    "B008",     # Do not perform function calls in argument defaults (Textual uses this)
    "ARG002",   # Unused method argument (common in abstract methods)
    "PTH123",   # Use Path.open() - sometimes `open()` is clearer
    "SIM105",   # Use contextlib.suppress - sometimes explicit try-except is clearer
    "RET504",   # Unnecessary assignment before return - sometimes clearer for debugging
    "SIM102",   # Collapsible if - sometimes separate ifs are clearer
    "SIM108",   # Use ternary operator - sometimes if-else is clearer
    "SIM117",   # Multiple with statements - sometimes nested is clearer
    "ASYNC109", # Async function with timeout parameter - common pattern
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Line ending style
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
# Test files can have unused imports, arguments, and descriptive names
"tests/**/*.py" = ["ARG", "F401", "N802"]

# Factory function uses PascalCase intentionally
"src/aria2rpc/client.py" = ["N802"]

[tool.ruff.lint.isort]
# Import sorting configuration
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["aria2rpc", "ariatuc"]

# ==============================================================================
# Mypy Configuration - Static Type Checker
# ==============================================================================
[tool.mypy]
# Target Python version
python_version = "3.11"

# Source directories
mypy_path = "src"
packages = ["aria2rpc", "ariatuc"]

# Type checking strictness (balanced for productivity)
check_untyped_defs = true
disallow_any_generics = false       # Too strict for dict/list usage
disallow_incomplete_defs = false    # Allow incremental typing
disallow_untyped_decorators = false # Textual uses many decorators
disallow_untyped_defs = false       # Allow gradual typing
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false             # Too noisy for dict.get() etc.
warn_unused_configs = true
warn_unused_ignores = true

# Additional useful checks
warn_unreachable = true
strict_equality = true

# Error reporting
show_error_codes = true
show_column_numbers = true
pretty = true

# Incremental mode
incremental = true
cache_dir = ".mypy_cache"

# Import discovery
namespace_packages = true
explicit_package_bases = true

# Per-module options for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = ["textual.*", "websockets.*"]
ignore_missing_imports = true

# Relax strictness for tests
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
